<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-SITE 2026 — Quantum Science, Information Technology and Engineering</title>

    <!-- React 18 & Babel Standalone (matching umd-uqa stack) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: {
                            950: '#030712',
                            900: '#020617',
                            800: '#0b1226',
                        },
                        quantum: {
                            cyan: '#22d3ee',
                            purple: '#a855f7',
                            sky: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
            background-color: #030712;
            color: #f8fafc;
        }

        body {
            background-color: #030712;
            color: #f8fafc;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #root {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .animate-fade-in {
            animation: fadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100">
    <div id="root"></div>

    <!-- Application Components -->
    <script type="text/babel" src="./Navbar.js"></script>
    <script type="text/babel" src="./Home.js"></script>
    <script type="text/babel" src="./Schedule.js"></script>
    <script type="text/babel" src="./Sponsors.js"></script>
    <script type="text/babel" src="./Support.js"></script>

    <!-- Main Router & Shell -->
    <script type="text/babel" src="./App.js"></script>
</body>
</html>
