<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-SITE 2026 — Quantum Science, Information Technology and Engineering Conference</title>

    <!-- React 18 & Babel Standalone (matching umd-uqa stack) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        space: {
                            950: '#030712',
                            900: '#020617',
                            850: '#0b1226',
                            800: '#0f172a',
                        },
                        quantum: {
                            cyan: '#22d3ee',
                            purple: '#a855f7',
                            sky: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        html {
            scroll-behavior: smooth;
            background-color: #030712;
            color: #f8fafc;
        }

        body {
            background-color: #030712;
            color: #e2e8f0;
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient background glow orbs */
        .ambient-glow-cyan {
            position: fixed;
            width: 55vw;
            height: 55vw;
            max-width: 650px;
            max-height: 650px;
            background: radial-gradient(circle, rgba(34, 211, 238, 0.12) 0%, rgba(34, 211, 238, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
            border-radius: 9999px;
            z-index: 0;
        }

        .ambient-glow-purple {
            position: fixed;
            width: 50vw;
            height: 50vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(168, 85, 247, 0) 70%);
            filter: blur(80px);
            pointer-events: none;
            border-radius: 9999px;
            z-index: 0;
        }

        /* Glassmorphism primitives */
        .glass-panel {
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-panel-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-panel-hover:hover {
            border-color: rgba(34, 211, 238, 0.35);
            box-shadow: 0 0 25px rgba(34, 211, 238, 0.08);
            transform: translateY(-2px);
        }

        /* Dashed wireframe placeholder style */
        .dashed-wireframe {
            border: 1.5px dashed rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.02);
            transition: border-color 0.2s ease;
        }

        .dashed-wireframe:hover {
            border-color: rgba(34, 211, 238, 0.4);
        }

        .animate-fade-in {
            animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-200">
    <div id="root"></div>

    <!-- Application Components (umd-uqa style) -->
    <script type="text/babel" src="./Navbar.js"></script>
    <script type="text/babel" src="./Home.js"></script>
    <script type="text/babel" src="./Schedule.js"></script>
    <script type="text/babel" src="./Sponsors.js"></script>
    <script type="text/babel" src="./Support.js"></script>

    <!-- Main Router & Shell -->
    <script type="text/babel" src="./App.js"></script>
</body>
</html>
